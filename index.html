<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a moment...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #111111; color: #d9d9d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .cf-container { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .cf-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid #2e2e2e; padding-bottom: 16px; }
        .cf-title { font-size: 18px; font-weight: 600; color: #ffffff; }
        .cf-brand { font-size: 12px; color: #f6821f; font-weight: 700; letter-spacing: 0.5px; }
        .cf-box { background: #222222; border: 1px solid #333333; border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .checkbox-spinner { width: 22px; height: 22px; border: 3px solid #333; border-top: 3px solid #f6821f; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .cf-text { font-size: 14px; color: #e0e0e0; font-weight: 500; }
        .cf-footer { font-size: 11px; color: #666666; text-align: center; line-height: 1.5; }
        .cf-footer span { color: #888888; }
    </style>
</head>
<body>

<div class="cf-container">
    <div class="cf-header">
        <div class="cf-title">Security Check</div>
        <div class="cf-brand">CLOUDFLARE</div>
    </div>

    <div class="cf-box">
        <div class="checkbox-spinner"></div>
        <div class="cf-text">Verifying your browser & device...</div>
    </div>

    <div class="cf-footer">
        DDoS protection by <span>Cloudflare</span><br>
        Ray ID: <span id="ray-id">8f12a9b3c4d5e6</span>
    </div>
</div>

<script>
    // Earnlinks Base Link Updated
    const EARNLINKS_URL = "https://earnlinks.in/Metadata";

    // Destination target page after shortener completion
    const DESTINATION_PAGE = "https://jerrymodsvip.github.io/Key-bridge/access.html";

    // HWID Extraction
    const urlParams = new URLSearchParams(window.location.search);
    const hwid = urlParams.get('hwid') || "UNKNOWN_HWID";

    // Random Cloudflare Ray ID
    document.getElementById('ray-id').innerText = Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 8);

    // Instant Redirect (0.1s execution)
    setTimeout(() => {
        const targetUrl = DESTINATION_PAGE + "?hwid=" + encodeURIComponent(hwid);
        const finalRedirect = EARNLINKS_URL + "?url=" + encodeURIComponent(targetUrl);
        
        window.location.href = finalRedirect;
    }, 100);
</script>

</body>
</html>
